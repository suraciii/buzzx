<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>buzzx / A quiet place to collaborate</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#efeee9;color:#22282a;font:16px/1.5 Arial,sans-serif}main{width:1328px;margin:auto;padding:36px 32px 40px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #c9cdc9;padding-bottom:18px}.brand{font-size:23px;font-weight:700;letter-spacing:-1px}header small{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#596363}nav{display:flex;gap:8px;margin:22px 0}button{font:inherit;font-size:13px;border:1px solid #b6bebb;padding:7px 13px;background:transparent;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#22282a;color:#fff;border-color:#22282a}h1{font-size:40px;font-weight:500;letter-spacing:-1.2px;line-height:1.15;margin:22px 0 10px}h2{font-size:20px;font-weight:500;margin:0 0 6px}p{margin:0;color:#556160}.lead{font-size:17px;max-width:980px;margin-bottom:26px}.kicker{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#5a6663}.label{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 10px}.label span{font-size:12px;color:#556160}.terminal{--bg:#14181a;--surface:#1d2326;--selected:#303a3e;--fg:#e7ebe8;--meta:#a1ada8;--line:#52615c;--accent:#9bd5c9;--attention:#edc57d;--error:#f29da5;--reverse:#e7ebe8;--reversefg:#14181a;--cw:10px;--rh:23px;background:var(--bg);color:var(--fg);font-family:'DejaVu Sans Mono','Noto Sans Mono CJK SC',monospace;font-size:16.6px;line-height:var(--rh);width:calc(var(--cols)*var(--cw));height:calc(var(--rows)*var(--rh));position:relative;overflow:hidden;font-variant-ligatures:none}.terminal.light{--bg:#fafaf7;--surface:#eeefeb;--selected:#dce3de;--fg:#25332e;--meta:#56645e;--line:#818f86;--accent:#1a6960;--attention:#835506;--error:#ad3545;--reverse:#25332e;--reversefg:#fafaf7}.terminal.mono{--bg:#14181a;--surface:#14181a;--selected:#e7ebe8;--fg:#e7ebe8;--meta:#e7ebe8;--line:#e7ebe8;--accent:#e7ebe8;--attention:#e7ebe8;--error:#e7ebe8;--reverse:#e7ebe8;--reversefg:#14181a}.run,.paint{position:absolute;white-space:pre}.run{height:var(--rh);font-weight:400}.bold{font-weight:700}.meta{color:var(--meta)}.accent{color:var(--accent)}.attention{color:var(--attention);font-weight:700}.error{color:var(--error);font-weight:700}.inverse{color:var(--reversefg);font-weight:700}.selectedtext{color:var(--fg)}.mono .selectedtext{color:var(--reversefg)}.mono .accent{font-weight:700;text-decoration:underline}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 28px}.grid .terminal{--cw:7.7px;--rh:19px;font-size:12.78px}.notes{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:26px}.notes article{border-top:1px solid #bcc4be;padding-top:14px}.notes h2{font-size:17px}.notes p{font-size:14px}.foot{font-size:12px;color:#65716b;margin-top:24px;padding-top:16px;border-top:1px solid #c9cdc9}.minirow{display:flex;gap:28px;align-items:flex-start}.minirow .terminal{--cw:10px;--rh:23px;font-size:16.6px}.statelegend{font-size:14px;color:#53615a;padding-top:15px;max-width:460px}.statelegend p{margin-bottom:14px}.hero{display:flex;justify-content:center;background:#e4e5df;padding:20px 0}.hide{display:none}body[data-export] nav{display:none}body[data-export] main{padding-top:28px}.ref{font-size:13px;margin-top:24px}a{color:#266b61}.swatches{display:flex;gap:24px;flex-wrap:wrap;margin-top:12px}.swatch{font-size:13px}.swatch i{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:7px} .pill{font-family:monospace;font-size:13px;background:#dce3de;padding:2px 6px} 
</style>
<main><header><div class="brand">buzzx</div><small>Product design / 04 &nbsp; · &nbsp; Review draft</small></header>
<nav aria-label="Review boards"><button data-board="language">Design language</button><button data-board="surfaces">Shared surfaces</button><button data-board="resilience">Small + uncertain</button><button data-board="density">Density</button><span style="flex:1"></span><button data-theme="dark">Dark</button><button data-theme="light">Light</button><button data-theme="mono">NO_COLOR</button></nav>
<div id="board"></div><div class="foot">DESIGN PROPOSAL · Sample content, cell-based mockups. No live relay, working client or delivery claim. Browser controls belong to this review only.</div></main>
<script>
const q=new URLSearchParams(location.search);let board=q.get('board')||'language',theme=q.get('theme')||'dark';if(q.has('export'))document.body.dataset.export='true';
const issues=[];let serial=0;
function term(cols,rows,t=theme){const e=document.createElement('div');e.className='terminal '+t;e.style.setProperty('--cols',cols);e.style.setProperty('--rows',rows);e.dataset.cols=cols;e.dataset.rows=rows;e.setAttribute('role','img');e.setAttribute('aria-label',cols+' by '+rows+' terminal design study');const busy=new Set();let id=++serial;
function paint(x,y,w,h,role){if(x<0||y<0||x+w>cols||y+h>rows)issues.push({id,paint:[x,y,w,h]});const d=document.createElement('span');d.className='paint';d.style.cssText=`left:calc(${x}*var(--cw));top:calc(${y}*var(--rh));width:calc(${w}*var(--cw));height:calc(${h}*var(--rh));background:var(--${role})`;e.append(d)}
function tx(x,y,s,cls=''){let n=[...s].length;if(x<0||y<0||x+n>cols||y>=rows)issues.push({id,text:s,x,y,n,cols,rows});for(let i=x;i<x+n;i++){let key=y+':'+i;if(busy.has(key)&&s[i-x]!==' ')issues.push({id,overlap:s,x,y});busy.add(key)}const d=document.createElement('span');d.className='run '+cls;d.textContent=s;d.dataset.x=x;d.dataset.y=y;d.style.cssText=`left:calc(${x}*var(--cw));top:calc(${y}*var(--rh))`;e.append(d)}
return {e,tx,paint,cols,rows};}
function foot(t,keys,state='Connected',mode='Read'){t.tx(2,t.rows-2,keys,'meta');t.tx(2,t.rows-1,mode,'bold');t.tx(Math.max(2,t.cols-state.length-2),t.rows-1,state,state.includes('unconfirmed')?'attention':state.includes('failed')?'error':'meta')}
function head(t,title,back=''){t.paint(0,0,t.cols,1,'surface');t.tx(2,0,title,'bold');if(back)t.tx(t.cols-back.length-2,0,back,'meta')}
function msg(t,x,y,who,age,lines,{focus=false,tag='',kind='meta'}={}){if(focus)t.tx(x-2,y,'>','accent');t.tx(x,y,who,focus?'accent bold':'bold');t.tx(x+who.length+2,y,age,'meta');if(tag)t.tx(x+who.length+age.length+4,y,tag,kind);lines.forEach((s,i)=>t.tx(x,y+1+i,s));return y+lines.length+2}
function channel(){const t=term(120,30);t.paint(0,0,22,28,'surface');t.tx(2,0,'buzzx','bold');t.tx(25,0,'# buzzx-tui','bold');t.tx(2,2,'Inbox','bold');t.tx(9,2,'All','meta');t.tx(2,4,'CHANNELS','meta');t.paint(1,6,20,1,'selected');t.tx(2,6,'1 buzzx-tui','selectedtext bold');t.tx(2,7,'2 general');t.tx(17,7,'@ 2','attention');t.tx(2,8,'3 design');t.tx(17,8,'● 3','meta');t.tx(2,9,'4 release');t.tx(17,9,'?','meta');t.tx(2,12,'DMs','meta');t.tx(2,14,'5 Clara');t.tx(2,15,'6 Build');t.tx(2,25,'f Filter','meta');t.tx(2,26,'c Conversations','meta');t.tx(2,27,'a My agents','meta');
msg(t,25,3,'surac','8m',['Can we make the thread easier to follow?','The channel should stay quiet while I am reading.']);
msg(t,25,7,'Clara','6m',['Keep the author close to the message.','Put the reply destination next to the draft.']);
msg(t,25,11,'Build','4m',['The 40-column layout can keep both in view.','The thread returns to the same place in the channel.'],{tag:'reply'});
msg(t,25,15,'surac','2m',['Show the small version and the unknown-send state too.']);
msg(t,25,18,'Product','1m',['@surac I have included both in the review.','The same layout rules cover the Inbox and My agents.'],{focus:true,tag:'@you',kind:'attention'});t.tx(25,21,'[file] layout-review.png','meta');t.tx(25,28,'Enter Reply   i Write   t Thread   ? Help','meta');t.tx(2,29,'Read','bold');t.tx(109,29,'Connected','meta');return t}
function thread(){const t=term(80,20);head(t,'# buzzx-tui / Thread');msg(t,4,2,'surac','8m',['Can we make the thread easier to follow?'],{tag:'root'});msg(t,4,5,'Clara','6m',['Put the reply destination next to the draft.'],{tag:'reply'});msg(t,4,8,'Build','4m',['The 40-column layout can keep both in view.'],{tag:'reply'});t.paint(2,13,76,4,'surface');t.tx(2,13,'|','accent');t.tx(4,13,'Reply to Build','accent bold');t.tx(4,15,'Please include the small-window capture.');t.paint(4+'Please include the small-window capture.'.length,15,1,1,'fg');foot(t,'Enter Send   Alt+Enter Newline   Esc Nav','Connected','Reply');return t}
function picker(){const t=term(80,20);head(t,'Inbox / For you','Esc Back');t.tx(4,3,'CHANNELS','meta');t.paint(2,5,76,1,'selected');t.tx(2,5,'> 1  general','selectedtext bold');t.tx(72,5,'@ 2','selectedtext bold');t.tx(4,7,'2  design');t.tx(72,7,'@ 1','attention');t.tx(4,10,'DMs','meta');t.tx(4,12,'3  Clara');t.tx(72,12,'@ 1','attention');foot(t,'j/k Select   Enter Open   f Filter   ? Help','Connected','Pick');return t}
function agents(){const t=term(80,17);head(t,'My agents','Esc Back');t.tx(4,2,'NAME','meta');t.tx(38,2,'OBSERVED STATE','meta');t.paint(2,4,76,1,'selected');t.tx(2,4,'> Build','selectedtext bold');t.tx(38,4,'Working','selectedtext bold');t.tx(4,6,'Product');t.tx(38,6,'No active turn observed');t.tx(4,8,'Research');t.tx(38,8,'Unknown','meta');t.tx(4,12,'Build  73ae...1c08','meta');foot(t,'j/k Select   Enter Details','Connected','Agents');return t}
function detail(){const t=term(80,17);head(t,'My agents / Build','Esc Back');t.tx(4,2,'Working','bold');t.tx(4,4,'Last signal  3s ago','meta');t.tx(4,5,'Key          73ae...1c08','meta');t.tx(4,8,'CONVERSATIONS','meta');t.paint(2,10,76,1,'selected');t.tx(2,10,'> # buzzx-tui','selectedtext bold');t.tx(4,12,'Unavailable context','meta');foot(t,'j/k Select   Enter Open channel','Connected','Agents');return t}
function compact(cols,rows,tone=theme,state='reply'){const t=term(cols,rows,tone);const tiny=cols<40;if(tiny){head(t,'Thread #buzzx...');t.tx(0,1,'Build: Checks passed.');t.tx(0,2,'Reply to Build','accent bold');t.tx(0,3,'Please share evidence.');t.paint(22,3,1,1,'fg');t.tx(0,4,'Enter:send Esc:nav','meta');t.tx(0,5,'Connected','meta');return t}head(t,'# buzzx-tui / Thread');msg(t,2,2,state==='edit'?'surac':'Build',state==='edit'?'1m':'2m',[state==='edit'?'Please share the first capture.':'The small layout is ready.']);if(state==='uncertain'){t.tx(2,5,'surac  1s  ? Unconfirmed','attention');t.tx(2,6,'Please share the evidence.');t.tx(2,8,'Esc Back   ? Help','meta');t.tx(0,9,'Send unconfirmed','attention');return t}t.paint(0,5,cols,3,'surface');t.tx(0,5,'|','accent');t.tx(2,5,state==='edit'?'Edit own message':'Reply to Build','accent bold');t.tx(2,6,'Please share the evidence.');t.paint(2+'Please share the evidence.'.length,6,1,1,'fg');t.tx(2,8,'Enter Send   Esc Nav','meta');t.tx(2,9,'Connected','meta');return t}
function error(){const t=term(80,12);head(t,'# buzzx-tui / Thread');msg(t,4,2,'Clara','2m',['Please send the layout to the team.']);t.paint(2,6,76,3,'surface');t.tx(2,6,'|','accent');t.tx(4,6,'Reply to Clara','accent bold');t.tx(4,7,'@Twin please review this layout.');t.paint(4+'@Twin please review this layout.'.length,7,1,1,'fg');t.tx(2,10,'Enter Send   Esc Nav, then ? Help','meta');t.tx(2,11,'Not sent: @Twin is ambiguous. Use an exact identity.','error');return t}
function smallRead(tone){const t=term(80,12,tone);head(t,'# buzzx-tui / Thread','Esc Back');msg(t,4,2,'Clara','3m',['Keep the author close to the message.'],{tag:'root'});msg(t,4,4,'Product','1m',['@surac the layout review is ready.'],{focus:true,tag:'@you',kind:'attention'});foot(t,'Enter Reply   i Root   ? Help');return t}
function wideSmall(){const t=term(80,12);t.paint(0,0,22,10,'surface');t.tx(2,0,'Inbox / All','bold');t.tx(2,2,'CHANNELS','meta');t.paint(1,3,20,1,'selected');t.tx(2,3,'1 buzzx-tui','selectedtext bold');t.tx(2,4,'2 general');t.tx(17,4,'@ 2','attention');t.tx(2,5,'3 design');t.tx(2,7,'DMs','meta');t.tx(2,8,'4 Clara');t.tx(25,0,'# buzzx-tui','bold');msg(t,25,2,'Clara','3m',['Can we review the narrow layout?']);msg(t,25,4,'Product','1m',['The author and destination stay visible.'],{focus:true});t.tx(25,10,'Enter Reply  i Write  t Thread','meta');t.tx(2,10,'f Filter','meta');t.tx(2,11,'Read','bold');t.tx(69,11,'Connected','meta');return t}
function narrowRead(){const t=term(79,12);head(t,'# buzzx-tui');msg(t,4,2,'Clara','3m',['Can we review the narrow layout?']);msg(t,4,4,'Product','1m',['The author and destination stay visible.'],{focus:true});foot(t,'j/k Move  c Conversations  Enter Reply  i Write');return t}
function tinyAgents(){const t=term(24,6);head(t,'My agents');t.paint(0,1,24,3,'selected');t.tx(0,1,'> Product','selectedtext bold');t.tx(2,2,'No active turn','selectedtext');t.tx(2,3,'observed','selectedtext');t.tx(0,4,'Enter:detail Esc:back','meta');t.tx(0,5,'Connected','meta');return t}
function missingRoot(){const t=term(40,10);head(t,'# buzzx-tui / Thread','Esc Back');t.tx(2,2,'Root deleted','meta');msg(t,2,4,'Build','2m',['Replies remain readable.'],{focus:true});t.tx(2,8,'Enter Reply   ? Help','meta');t.tx(2,9,'Reconnecting; stale','attention');return t}
function tile(title,caption,t){const f=document.createElement('section');const l=document.createElement('div');l.className='label';l.innerHTML='<h2>'+title+'</h2><span>'+caption+'</span>';f.append(l,t.e);return f}
function intro(k,title,lead){return '<div class="kicker">'+k+'</div><h1>'+title+'</h1><p class="lead">'+lead+'</p>'}
function render(){issues.length=0;serial=0;const b=document.getElementById('board');b.innerHTML='';document.querySelectorAll('[data-board]').forEach(e=>e.setAttribute('aria-pressed',e.dataset.board===board));document.querySelectorAll('[data-theme]').forEach(e=>e.setAttribute('aria-pressed',e.dataset.theme===theme));if(board==='language'){b.innerHTML=intro('01 / Design language','A quiet place to collaborate.','A continuous conversation, stable places to navigate, and one clear place to act. People and agents share the same message grammar.');let h=document.createElement('div');h.className='hero';h.append(channel().e);b.append(h);b.insertAdjacentHTML('beforeend','<div class="notes"><article><h2>Place stays neutral.</h2><p>A compact, shaded row marks the current conversation. Navigation does not compete with the discussion.</p></article><article><h2>Focus follows the action.</h2><p>A small marker identifies the message target. When writing, the accent moves to the composer and its explicit destination.</p></article><article><h2>Attention has a reason.</h2><p>Only a verified mention, uncertainty or failure earns a signal. Color never stands in for a state label.</p></article></div><div class="swatches"><span class="swatch"><i style="background:#303a3e"></i>Location / neutral fill</span><span class="swatch"><i style="background:#9bd5c9"></i>Action / cool accent</span><span class="swatch"><i style="background:#edc57d"></i>Attention / explicit label</span><span class="swatch"><i style="background:#f29da5"></i>Failure / reason</span><span class="swatch">120 × 30 cells · one text size · no message cards</span></div>')}
else if(board==='surfaces'){b.innerHTML=intro('02 / Shared surfaces','Different tasks. The same grammar.','Context at the top. Content in the middle. Available actions and state at the bottom. Each surface reuses these positions.');let g=document.createElement('div');g.className='grid';g.append(tile('Thread / reply','80 × 20',thread()),tile('Inbox / choose a conversation','80 × 20',picker()),tile('My agents / list','80 × 17',agents()),tile('My agents / detail','80 × 17',detail()));b.append(g);b.insertAdjacentHTML('beforeend','<div class="notes"><article><h2>One list row.</h2><p>Inbox, agents and working contexts share selection and alignment. Meaningful state stays visible before names are clipped.</p></article><article><h2>One composer.</h2><p>New message, Reply to and Edit own message share a layout. The destination stays attached to the draft.</p></article><article><h2>One honest state.</h2><p>Working, Unknown and No active turn observed keep their meanings. Reading a message never proves agent execution.</p></article></div>')}
else if(board==='resilience'){b.innerHTML=intro('03 / Resilience','Less room. No less meaning.','Density changes before meaning does. A destination, a draft, and an honest outcome must survive both small terminals and lost color.');let g=document.createElement('div');g.className='grid';g.append(tile('Light / thread reading','80 × 12',smallRead('light')),tile('NO_COLOR / same fixture','80 × 12',smallRead('mono')));b.append(g);let m=document.createElement('div');m.className='minirow';m.append(tile('Thread / reply','40 × 10',compact(40,10)),tile('Write / uncertain','40 × 10',compact(40,10,theme,'uncertain')),tile('Minimum / reply','24 × 6',compact(24,6)));b.append(m);let g2=document.createElement('div');g2.className='grid';g2.append(tile('Refused mention / draft retained','80 × 12',error()));let notes=document.createElement('div');notes.className='statelegend';notes.innerHTML='<h2>Outcome is part of the interface.</h2><p><b>Sending</b> is pending. <b>Not sent</b> keeps the draft for correction. <b>Unconfirmed</b> keeps the attempted message visible without offering a duplicate send.</p><p><b>Reconnecting</b> keeps loaded messages visible and blocks publishing. <b>Unknown</b> never becomes a reassuring zero.</p><p>At 24 × 6, keep exactly six rows: context, target context, destination, input, keys, state. Remove decorative padding first.</p><p>Theme buttons change this review artifact only. The client inherits terminal defaults; the light and dark samples are controlled contrast studies.</p>';g2.append(notes);b.append(g2)}else{b.innerHTML=intro('04 / Density','Shrink the layout, keep the contract.','The 80-column boundary changes navigation. Short windows remove blank rows before they remove authors, destinations or state.');let g=document.createElement('div');g.className='grid';g.append(tile('Channel / wide','80 × 12',wideSmall()),tile('Channel / narrow','79 × 12',narrowRead()));b.append(g);let m=document.createElement('div');m.className='minirow';m.append(tile('Thread / editing','40 × 10',compact(40,10,theme,'edit')),tile('Deleted root + stale content','40 × 10',missingRoot()),tile('Agents / state','24 × 6',tinyAgents()));b.append(m);b.insertAdjacentHTML('beforeend','<div class="notes"><article><h2>Height pays for spacing.</h2><p>At 12 rows, no decorative gap separates author and body. Below 12 rows, remove extra padding. Keep one line of context while composing.</p></article><article><h2>Width changes structure.</h2><p>At 80 columns, the channel keeps its 22-cell sidebar. At 79 columns, c opens the full-screen Inbox. A thread is always one column.</p></article><article><h2>State wins over the name.</h2><p>A long Agent state wraps. Unknown is never abbreviated to Idle. On disconnect, loaded content stays visible and publication is blocked.</p></article></div>')}window.designAudit={issues,board,theme,terminals:serial};}
document.querySelectorAll('[data-board]').forEach(e=>e.onclick=()=>{board=e.dataset.board;render()});document.querySelectorAll('[data-theme]').forEach(e=>e.onclick=()=>{theme=e.dataset.theme;render()});render();
</script></html>
